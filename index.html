<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L'Oréal Smart Product Advisor</title>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="page-wrapper">
      <!------- Header / Branding ------->
      <header class="site-header">
        <div class="brand-logo-container">
          <img src="loreal-logo.png" alt="L'Oréal Logo" class="brand-logo" />
        </div>
        <h1 class="site-title">Smart Product Advisor</h1>
        <p class="site-subtitle">Personalized Beauty, Skincare & Haircare Consultations</p>
      </header>

      <!------- Chat Area ------->
      <main>
        <section class="chatbox">
          <!-- Quick Starter Prompts -->
          <div class="quick-prompts">
            <button type="button" class="prompt-chip" onclick="sendPrompt('My hair is very dry and dandruffy')">💧 Dry & Dandruff Hair</button>
            <button type="button" class="prompt-chip" onclick="sendPrompt('Suggest a hydrating morning skincare routine')">✨ Morning Skincare</button>
            <button type="button" class="prompt-chip" onclick="sendPrompt('What serum is best for dark spots?')">🌟 Dark Spot Serum</button>
            <button type="button" class="prompt-chip" onclick="sendPrompt('Recommend a routine for anti-aging and wrinkles')">⏳ Anti-Aging Routine</button>
          </div>

          <div id="chatWindow" class="chat-window">
            <!-- messages will be appended here via JS -->
          </div>

          <form id="chatForm" class="chat-form">
            <label for="userInput" class="visually-hidden">Message</label>
            <input
              id="userInput"
              name="userInput"
              type="text"
              placeholder="Ask me about products, routines, ingredients, or hair & skin concerns…"
              autocomplete="off"
              required
            />
            <button type="submit" id="sendBtn" aria-label="Send">
              <span class="material-icons">send</span>
              <span class="visually-hidden">Send</span>
            </button>
          </form>
        </section>
      </main>

      <!------- Footer Links ------->
      <footer class="site-footer">
        <p>&copy; 2025 L'Oréal. All rights reserved.</p>
        <nav>
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Use</a>
          <a href="#">Contact Expert</a>
        </nav>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
